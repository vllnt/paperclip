name: Set up the workspace
description: Node 24, pnpm 9.15.4 and a frozen-lockfile install without lifecycle scripts. Needs a full checkout first.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 9.15.4
    - name: Install workspace dependencies
      shell: bash
      run: |
        if ! pnpm install --frozen-lockfile --ignore-scripts; then
          # The checked-in lockfile can be stale for a merge tree; resolve it, then require it frozen again.
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
        fi
