name: Typecheck probe
# Throwaway measurement for VLL-1272 (not for merge): how long do install and typecheck take on a hosted runner?
on:
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    name: Probe typecheck (all but server and runner)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
      - name: Install
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile --ignore-scripts
          echo "install: $(( $(date +%s) - start ))s"
      - name: Preflight workspace links
        run: |
          start=$(date +%s)
          pnpm run preflight:workspace-links
          echo "preflight: $(( $(date +%s) - start ))s"
      - name: Typecheck
        run: |
          start=$(date +%s)
          pnpm -r --no-bail --filter '!@paperclipai/server' --filter '!@paperclipai/paperclip-runner' typecheck 2>&1 | tee "$RUNNER_TEMP/tc.log" || true
          echo "typecheck: $(( $(date +%s) - start ))s"
          grep -E "error TS|ERR_PNPM|Failed|failed" "$RUNNER_TEMP/tc.log" | head -40 || true
          test "$(grep -c 'error TS\|ERR_PNPM' "$RUNNER_TEMP/tc.log")" = 0

  server:
    name: Probe typecheck (server, builds the runner)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Preflight workspace links
        run: pnpm run preflight:workspace-links
      - name: Typecheck server
        run: |
          start=$(date +%s)
          pnpm --filter @paperclipai/server typecheck
          echo "server typecheck: $(( $(date +%s) - start ))s"
