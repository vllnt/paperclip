name: Production image build check
# Builds the exact production image target for every pull request into main,
# without publishing it. Deploy-only failures (Dockerfile order, server build,
# runner binary) then block the PR instead of the post-merge publish job.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - deploy/compose.yaml
      - deploy/release.json
permissions: {}
concurrency:
  group: image-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free disposable hosted runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build all application source without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.event.pull_request.head.sha }}
            PAPERCLIP_BUILD_VERSION=2026.1001.0-vllnt
            INSTALL_LOCAL_CLIS=false
          # Read the production cache only; pull requests never write to it.
          cache-from: type=gha,scope=paperclip-production,timeout=1m
