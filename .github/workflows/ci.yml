name: CI
# One workflow and one required check: "CI gate". There are no `paths` filters on
# purpose. A path-filtered check that never starts leaves a required check on
# "Expected" forever, so which jobs run is decided inside the workflow (the
# `changes` job) and the gate always reports. `pull_request` has no base-branch
# filter so a PR retargeted to main (stacked PRs) already has a result;
# `merge_group` is listed so the same checks report if a merge queue is turned on.
#
# Adding a job: add it under `jobs:`, to `needs:` of `gate`, and to ALWAYS (or
# CONDITIONAL plus a classifier output) in scripts/ci/gate-verdict.mjs.
# ci-workflow.test.mjs fails if they disagree. Require only "CI gate".
#
# Runners: `changes`, `scripts`, `policy`, `secrets` and `gate` are short and always use
# GitHub-hosted ubuntu-latest (the Node it ships is enough; the scripts have no
# dependencies), so a broken or empty self-hosted pool cannot stop the gate from
# reporting. Heavy jobs use the repository variable CI_RUNS_ON, a single runner
# label (default ubuntu-latest); use ephemeral runners only.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An empty PR number must not collapse every push into one cancelling group.
  group: ci-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      need_sentry: ${{ steps.classify.outputs.need_sentry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Classify the change
        id: classify
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/changed-paths.bin"
          : > "$paths"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The checkout is the PR merge commit: HEAD^1 is the base, so this is exactly the PR's change.
            # Anything unexpected leaves the list empty, which the classifier treats as "run everything".
            if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
              echo "::warning::HEAD is not a merge commit; running everything"
            elif ! git diff --no-renames -z --name-only HEAD^1 HEAD > "$paths"; then
              echo "::warning::git diff failed; running everything"
              : > "$paths"
            fi
          fi
          node scripts/ci/classify-changes.mjs --event "$GITHUB_EVENT_NAME" < "$paths"

  scripts:
    name: CI script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/ci
            .github/workflows
          persist-credentials: false
      - run: node --test scripts/ci/*.test.mjs

  policy:
    name: Policy (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Repository policy checks
        # The repository has no linter; its rules are these dependency-free scripts.
        # Every check runs and all failures are reported together (no install needed).
        run: |
          fail=0
          check() {
            echo "::group::$*"
            "$@" || { fail=1; echo "::error title=Policy::$* failed"; }
            echo "::endgroup::"
          }
          check node scripts/check-module-boundaries.mjs
          check node scripts/check-no-git-push.mjs
          check node scripts/check-node-version-policy.mjs
          check node scripts/check-forbidden-tokens.mjs
          check node scripts/check-token-gates.mjs
          check node scripts/check-grey-gate.mjs
          check node scripts/sync-agent-palette-tokens.mjs --check
          check node scripts/sync-cliplab-character.mjs --check
          check node scripts/check-docker-deps-stage.mjs
          check node scripts/release-package-map.mjs check
          check node --test scripts/check-grey-gate.test.mjs scripts/check-module-boundaries.test.mjs scripts/check-no-git-push.test.mjs scripts/release-package-map.test.mjs scripts/check-release-package-bootstrap.test.mjs
          exit "$fail"
      - name: Install checksum-pinned actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
      - name: Workflow policy
        # shellcheck and pyflakes are off: their versions come with the runner image and would drift.
        run: |
          fail=0
          node scripts/ci/workflow-policy.mjs || fail=1
          "$RUNNER_TEMP/actionlint-bin/actionlint" -shellcheck= -pyflakes= -color || fail=1
          exit "$fail"

  typecheck:
    name: Typecheck (${{ matrix.lane }})
    # Same coverage as `pnpm run typecheck`, in three lanes that run in parallel. New workspaces with a
    # `typecheck` script land in `packages` automatically. `cli` follows `server` in one lane because its
    # types come from the runner build that the server typecheck triggers (the Rust compile is most of that lane).
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: packages
            run: pnpm -r --no-bail --filter '!@paperclipai/server' --filter '!paperclipai' --filter '!@paperclipai/paperclip-runner' typecheck
          - lane: server and cli
            run: pnpm --filter @paperclipai/server typecheck && pnpm --filter paperclipai typecheck
          - lane: runner
            run: pnpm --filter @paperclipai/paperclip-runner typecheck
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm run preflight:workspace-links
      - run: ${{ matrix.run }}

  secrets:
    name: Secrets
    uses: ./.github/workflows/security.yml

  sentry:
    name: Real Sentry SDK isolation
    needs: changes
    if: needs.changes.outputs.need_sentry == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install the audited optional SDK outside the workspace
        run: |
          sentry_version=$(node -p 'require("./server/package.json").peerDependencies["@sentry/node"]')
          npm install --prefix "$RUNNER_TEMP/sentry-contract-sdk" --ignore-scripts --no-audit --no-fund --package-lock=false "@sentry/node@$sentry_version"
      - name: Verify run failure isolation with the real SDK
        env:
          NODE_PATH: ${{ runner.temp }}/sentry-contract-sdk/node_modules
          PAPERCLIP_REQUIRE_SENTRY_TEST_SDK: "1"
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/run-failure-sentry-real-sdk.test.ts

  gate:
    name: CI gate
    # Never skipped: a skipped required check counts as passing.
    if: ${{ always() }}
    needs: [changes, scripts, policy, typecheck, secrets, sentry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Evaluate the gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/evaluate-gate.mjs
