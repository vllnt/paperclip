name: Test probe
# Throwaway measurement for VLL-1272 (not for merge): does the test suite pass on a hosted runner, and how long do the shards take?
on:
  push:
    branches: [ci/test-probe]

permissions:
  contents: read

jobs:
  tests:
    name: probe ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server 1/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 0 --shard-count 12
          - name: server 2/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 1 --shard-count 12
          - name: server 3/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 2 --shard-count 12
          - name: server 4/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 3 --shard-count 12
          - name: server 5/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 4 --shard-count 12
          - name: server 6/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 5 --shard-count 12
          - name: server 7/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 6 --shard-count 12
          - name: server 8/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 7 --shard-count 12
          - name: server 9/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 8 --shard-count 12
          - name: server 10/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 9 --shard-count 12
          - name: server 11/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 10 --shard-count 12
          - name: server 12/12
            cmd: pnpm test:run:general -- --group general-server-without-chat --shard-index 11 --shard-count 12
          - name: chat 1/3
            cmd: pnpm test:run:general -- --group general-chat --shard-index 0 --shard-count 3
          - name: chat 2/3
            cmd: pnpm test:run:general -- --group general-chat --shard-index 1 --shard-count 3
          - name: chat 3/3
            cmd: pnpm test:run:general -- --group general-chat --shard-index 2 --shard-count 3
          - name: workspaces-a 1/2
            cmd: pnpm test:run:general -- --group general-workspaces-a --shard-index 0 --shard-count 2
          - name: workspaces-a 2/2
            cmd: pnpm test:run:general -- --group general-workspaces-a --shard-index 1 --shard-count 2
          - name: workspaces-b
            cmd: pnpm test:run:general -- --group general-workspaces-b
          - name: serialized 1/9
            cmd: pnpm test:run:serialized -- --shard-index 0 --shard-count 9
          - name: serialized 2/9
            cmd: pnpm test:run:serialized -- --shard-index 1 --shard-count 9
          - name: serialized 3/9
            cmd: pnpm test:run:serialized -- --shard-index 2 --shard-count 9
          - name: serialized 4/9
            cmd: pnpm test:run:serialized -- --shard-index 3 --shard-count 9
          - name: serialized 5/9
            cmd: pnpm test:run:serialized -- --shard-index 4 --shard-count 9
          - name: serialized 6/9
            cmd: pnpm test:run:serialized -- --shard-index 5 --shard-count 9
          - name: serialized 7/9
            cmd: pnpm test:run:serialized -- --shard-index 6 --shard-count 9
          - name: serialized 8/9
            cmd: pnpm test:run:serialized -- --shard-index 7 --shard-count 9
          - name: serialized 9/9
            cmd: pnpm test:run:serialized -- --shard-index 8 --shard-count 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: ${{ matrix.cmd }}
