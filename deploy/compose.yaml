services:
  paperclip:
    image: ghcr.io/vllnt/paperclip@sha256:e1657822e0e7a2be9439e0228acf177e23b69536ab8e438897a32db8385e9661
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_BIND: custom
      PAPERCLIP_BIND_HOST: 0.0.0.0
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: ${DATABASE_URL:?required}
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?required}
      PAPERCLIP_AI_GATEWAY_ALLOWED_ORIGINS: ${PAPERCLIP_AI_GATEWAY_ALLOWED_ORIGINS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?required}
      PAPERCLIP_SECRETS_MASTER_KEY_FILE: /run/secrets/master-key
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_DB_BACKUP_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1536
    extra_hosts:
      - "${PAPERCLIP_AI_GATEWAY_HOST:?required}:${PAPERCLIP_AI_GATEWAY_HOST_IP:?required}"
    volumes:
      - /var/lib/paperclip/home:/paperclip
      - /var/lib/paperclip/secrets/master-key:/run/secrets/master-key:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
  db:
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=0775
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - /var/lib/paperclip/postgres:/var/lib/postgresql/data
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paperclip -d paperclip"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:18543:8443"
    volumes:
      - /var/lib/paperclip/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/paperclip/tls:/etc/paperclip-tls:ro
      - /var/lib/paperclip/ops:/var/lib/paperclip-ops:ro
      - /var/lib/paperclip/backups:/var/lib/paperclip-backups:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      paperclip: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
